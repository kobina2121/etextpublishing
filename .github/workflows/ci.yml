# Checks every pull request and every push to main.
#
# Only the checks that need no secrets run here: types, lint, formatting and
# unit tests. The Playwright suite and `next build` both need a reachable
# MongoDB, so they run locally (`npm run test:e2e`, `npm run build`) against a
# development database — never against production from CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, formatting
        run: npm run check

      - name: Unit tests
        run: npm test
